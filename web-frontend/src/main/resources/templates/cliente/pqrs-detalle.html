<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda :: tienda('PQRS ' + ${q.radicado}, ~{::#pagina})}">
<body>
<div id="pagina">
    <a th:href="@{/cuenta/pqrs}">Mis PQRS</a>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-2">
        <h1 class="mb-0"><span th:text="${q.tipoTexto}"></span> <span th:text="${q.radicado}"></span></h1>
        <span th:replace="~{fragments/comunes :: estado(${q.estado})}"></span>
    </div>
    <div class="row g-3">
        <div class="col-lg-8">
            <section class="hoja">
                <h2 class="h5">Tu mensaje</h2>
                <p class="mb-1" style="white-space: pre-line" th:text="${q.descripcion}"></p>
                <p class="small texto-suave mb-0">Radicada el <span th:text="${@fmt.fechaHora(q.fechaRadicacion)}"></span><th:block th:if="${q.pedidoCodigo}">, sobre el pedido <span th:text="${q.pedidoCodigo}"></span></th:block></p>
            </section>
            <section class="hoja" th:if="${q.respuesta}">
                <h2 class="h5">Respuesta de <span th:text="${q.asesorNombre}"></span></h2>
                <p class="mb-1" style="white-space: pre-line" th:text="${q.respuesta}"></p>
                <p class="small texto-suave mb-0" th:text="${@fmt.fechaHora(q.fechaCierre)}"></p>
            </section>
            <section class="hoja" th:unless="${q.respuesta}">
                <p class="mb-0 texto-suave">Estamos revisando tu caso. Te responderemos en máximo 5 días hábiles.</p>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="hoja">
                <h2 class="h5">Seguimiento</h2>
                <ul class="historial">
                    <li th:each="h : ${q.historial}"><strong th:text="${@fmt.estado(h.estado)}"></strong><br><small th:text="${@fmt.fechaHora(h.fecha)}"></small></li>
                </ul>
            </section>
        </div>
    </div>
</div>
</body>
</html>
