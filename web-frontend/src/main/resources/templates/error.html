<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda :: tienda('Aviso', ~{::#pagina})}">
<body>
<div id="pagina">
    <div class="hoja vacio">
        <i class="bi bi-signpost-split"></i>
        <h1 class="h3" th:text="${status == 404} ? 'No encontramos esta página' : 'Algo salió mal'">Aviso</h1>
        <p th:text="${status == 404} ? 'Revisa la dirección o vuelve al catálogo.' : 'Intenta de nuevo en unos segundos.'"></p>
        <a class="btn btn-primary" th:href="@{/}">Ir al inicio</a>
    </div>
</div>
</body>
</html>
