<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda :: tienda('Sin permiso', ~{::#pagina})}">
<body>

        <i class="bi bi-shield-lock"></i>

</html>
