<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda :: tienda('Nueva contraseña', ~{::#pagina})}">
<body>
<div id="pagina">
    <div class="tarjeta-login">
        <form class="hoja p-4" th:action="@{/restablecer}" method="post">
            <h1 class="h2 mb-1">Elige tu nueva contraseña</h1>
            <p class="texto-suave">Mínimo 8 caracteres.</p>
            <input type="hidden" name="token" th:value="${token}">
            <div th:if="${token == null or #strings.isEmpty(token)}" class="aviso aviso-error mb-3">El enlace no es válido. <a th:href="@{/recuperar}">Solicita uno nuevo</a>.</div>
            <div class="mb-3">
                <label class="form-label" for="password">Nueva contraseña</label>
                <input id="password" class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmacion">Repite la contraseña</label>
                <input id="confirmacion" class="form-control" type="password" name="confirmacion" required autocomplete="new-password">
            </div>
            <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
            <p class="mt-3 mb-0 text-center" th:if="${error}"><a th:href="@{/recuperar}">Solicitar un enlace nuevo</a></p>
        </form>
    </div>
</div>
</body>
</html>
