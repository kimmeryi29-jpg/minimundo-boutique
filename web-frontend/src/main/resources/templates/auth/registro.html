<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/tienda :: tienda('Crear cuenta', ~{::#pagina})}">
<body>
<div id="pagina">
    <div class="tarjeta-login">
        <form class="hoja p-4" th:action="@{/registro}" method="post" novalidate>
            <h1 class="h2 mb-1">Crea tu cuenta</h1>
            <p class="texto-suave">Solo necesitas tu nombre, tu correo y una contraseña.</p>
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre completo</label>
                <input id="nombre" class="form-control" name="nombre" th:value="${nombre}" th:classappend="${campos != null and campos['nombre'] != null} ? 'is-invalid'" required maxlength="100">
                <div class="invalid-feedback" th:if="${campos != null}" th:text="${campos['nombre']}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Correo</label>
                <input id="email" class="form-control" type="email" name="email" th:value="${email}" th:classappend="${campos != null and campos['email'] != null} ? 'is-invalid'" required autocomplete="email">
                <div class="invalid-feedback" th:if="${campos != null}" th:text="${campos['email']}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input id="password" class="form-control" type="password" name="password" minlength="8" th:classappend="${campos != null and campos['password'] != null} ? 'is-invalid'" required autocomplete="new-password" aria-describedby="ayuda-clave">
                <div id="ayuda-clave" class="form-text">Mínimo 8 caracteres.</div>
                <div class="invalid-feedback" th:if="${campos != null}" th:text="${campos['password']}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmacion">Repite la contraseña</label>
                <input id="confirmacion" class="form-control" type="password" name="confirmacion" th:classappend="${campos != null and campos['confirmacion'] != null} ? 'is-invalid'" required autocomplete="new-password">
                <div class="invalid-feedback" th:if="${campos != null}" th:text="${campos['confirmacion']}"></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
            <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
        </form>
    </div>
</div>
</body>
</html>
